<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3a166e" />
      <stop offset="55%" stop-color="#1d093b" />
      <stop offset="100%" stop-color="#0d031c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099" />
      <stop offset="50%" stop-color="#f5c542" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.55" />

  <!-- Back fanned card -->
  <g transform="translate(110, 95) rotate(-14 115 160)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="210" height="300" rx="22" fill="#220a44" stroke="url(#goldGrad)" stroke-width="8" />
    <text x="105" y="165" font-family="Georgia, serif" font-size="84" font-weight="bold" fill="#f5c542" text-anchor="middle">★</text>
  </g>

  <!-- Front White Ace/Joker Card -->
  <g transform="translate(175, 105) rotate(8 115 160)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="215" height="310" rx="22" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="7" />
    <text x="26" y="54" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#d00000">A</text>
    <text x="28" y="92" font-family="system-ui, sans-serif" font-size="34" fill="#d00000">♥</text>
    <text x="108" y="188" font-family="Georgia, serif" font-size="116" fill="#d00000" text-anchor="middle">♥</text>
    <text x="188" y="274" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#d00000" text-anchor="end">A</text>
  </g>

  <!-- Rush Crown Badge -->
  <g transform="translate(256, 425)" filter="url(#dropShadow)">
    <rect x="-155" y="-34" width="310" height="62" rx="31" fill="url(#goldGrad)" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#18082e" text-anchor="middle" letter-spacing="1.5">LEAST COUNT</text>
  </g>
</svg>
